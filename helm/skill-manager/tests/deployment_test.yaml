# The Deployment: the sources as one JSON flag, the GitHub App, OAuth, the
# GitHub token exchange, and the service token.
#
# Run with: make helm-test (helm unittest helm/skill-manager)
suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: skill-manager
  namespace: agent-platform
tests:
  - it: passes the sources as JSON, URLs and objects alike
    set:
      sources:
        - url: https://github.com/giantswarm/agent-platform
          ref: v4.180.0
          path: skills
          readOnly: true
        - https://github.com/giantswarm/agent-skills
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--sources=[{"path":"skills","readOnly":true,"ref":"v4.180.0","url":"https://github.com/giantswarm/agent-platform"},"https://github.com/giantswarm/agent-skills"]'
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cache-ttl=5m

  - it: passes no sources by default and calls no Kubernetes API
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --sources=[]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: reads skills with the GitHub App from its Secret
    set:
      github:
        app:
          secretName: skills-app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-app-private-key-file=/etc/skill-manager/github-app/private-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKILL_MANAGER_GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: skills-app
                key: app-id
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-app
            secret:
              secretName: skills-app
              items:
                - key: private-key
                  path: private-key

  - it: reads skills with the deprecated static token from its Secret
    set:
      github:
        tokenSecret:
          name: skills-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: skills-token
                key: token

  - it: refuses the App and a token together
    set:
      github:
        app:
          secretName: skills-app
        tokenSecret:
          name: skills-token
    asserts:
      - failedTemplate:
          errorMessage: "github.app.secretName and github.tokenSecret.name are mutually exclusive: skills are read with one credential"

  - it: passes the GitHub API URL
    set:
      github:
        apiUrl: https://ghe.example.com/api/v3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://ghe.example.com/api/v3

  - it: with OAuth and the service token
    set:
      oauth:
        enabled: true
        existingSecret: platform-oauth
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
      serviceToken:
        secretName: skill-manager-service
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-oauth=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-authorization-server=https://github.com/apps/giantswarm-agent-manager
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKILL_MANAGER_SERVICE_TOKEN
            valueFrom:
              secretKeyRef:
                name: skill-manager-service
                key: token

  - it: refuses the service token without OAuth, which would guard nothing
    set:
      serviceToken:
        secretName: skill-manager-service
    asserts:
      - failedTemplate:
          errorMessage: "serviceToken.secretName needs oauth.enabled: without it the API admits everyone"

  - it: passes the OCI registry allowlist
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oci-registries=gsoci.azurecr.io,gsociprivate.azurecr.io

  - it: fetches the GitHub grant through the token exchange, the whole Secret mounted
    set:
      oauth:
        enabled: true
        existingSecret: platform-oauth
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          existingSecret: skill-manager-github-exchange
          caSecretName: muster-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-endpoint=https://muster.example.com/oauth/token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-audience=skill-manager-app
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id-file=/etc/skill-manager/github-token-exchange/client-id
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-secret-file=/etc/skill-manager/github-token-exchange/client-secret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-ca-file=/etc/skill-manager/github-token-exchange-ca/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: skill-manager-github-exchange
              defaultMode: 0440

  - it: passes the client ID and names the rendered Secret
    set:
      oauth:
        enabled: true
        existingSecret: platform-oauth
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          clientID: skill-manager
          clientSecret: fixture
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=skill-manager
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: skill-manager-github-token-exchange
              defaultMode: 0440

  - it: renders no token exchange while it is unset
    set:
      github:
        enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-audience=skill-manager-app
      - isNull:
          path: spec.template.spec.volumes[1]

  - it: refuses the token exchange while github.enabled is false
    set:
      github:
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          existingSecret: skill-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange.tokenEndpoint is set while github.enabled is false: set github.enabled to check private repositories as the person"

  - it: refuses the token exchange without OAuth
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          existingSecret: skill-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange exchanges the person's ID token, which the server validates as an OAuth resource server: set oauth.enabled"

  - it: refuses the token exchange without an audience or a client secret
    set:
      oauth:
        enabled: true
        existingSecret: platform-oauth
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
    asserts:
      - failedTemplate:
          errorMessage: github.tokenExchange.existingSecret or github.tokenExchange.clientSecret is required with github.tokenExchange.tokenEndpoint
