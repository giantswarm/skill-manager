# app-test-suite (ATS >= 1.0) configuration, read by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests) of every branch
# build. The job creates a kind cluster; ATS installs the packaged chart with
# `helm upgrade --install --wait` into the namespace below and runs
# `pytest -m smoke` in tests/ats. The test dependencies
# (tests/ats/pyproject.toml, uv.lock) are generated by devctl; this file and
# the tests (tests/ats/test_smoke.py) are the repository's own.
#
# The smoke is the chart-level install check: the chart installs on a bare
# cluster and its Deployment becomes ready with the image the branch build
# pushed (branchPublish in giantswarm/github makes execute-chart-tests wait on
# that push). Behaviour against GitHub, muster and Dex is verified in
# agentlab.
app-tests-deploy-namespace: agent-platform

# functional: no second scenario. upgrade: no released chart to upgrade from
# yet.
skip-steps: [functional, upgrade]
