# The token exchange client Secret: rendered from clientSecret (and clientID)
# only when no existing Secret is named.
#
# Run with: make helm-test (helm unittest helm/skill-manager)
suite: github token exchange secret
templates:
  - templates/github-token-exchange-secret.yaml
release:
  name: skill-manager
  namespace: agent-platform
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
  github:
    enabled: true
    tokenExchange:
      tokenEndpoint: https://muster.example.com/oauth/token
      audience: skill-manager-app
tests:
  - it: renders client-secret and client-id
    set:
      github:
        tokenExchange:
          clientID: skill-manager
          clientSecret: fixture
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: skill-manager-github-token-exchange
      - equal:
          path: stringData
          value:
            client-secret: fixture
            client-id: skill-manager

  - it: renders no client-id without clientID
    set:
      github:
        tokenExchange:
          clientSecret: fixture
    asserts:
      - notExists:
          path: stringData.client-id

  - it: renders nothing with an existing Secret
    set:
      github:
        tokenExchange:
          existingSecret: skill-manager-github-exchange
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing without the token exchange
    set:
      github:
        tokenExchange:
          tokenEndpoint: ""
    asserts:
      - hasDocuments:
          count: 0
