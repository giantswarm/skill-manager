{{- $exchange := include "skill-manager.githubTokenExchange" . }}
{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's Dex
id_token (forwardToken), which this server validates against its trusted
audiences (oauth.trustedAudiences plus the requiredAudiences below), and
requests the requiredAudiences at login. With github.tokenExchange,
auth.providerApps names its audience, so muster answers grant_required with
that App's sign-in. Without OAuth muster connects anonymously.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  {{- /*
  The chart's labels, the muster identity (muster.giantswarm.io/type) and the
  Agent Platform tier (agent-platform.giantswarm.io/tool-group: agent-platform).
  muster.mcpServer.labels adds to and overrides all of them.
  */}}
  {{- $labels := include "skill-manager.labels" . | fromYaml }}
  {{- $labels = mergeOverwrite $labels (dict "muster.giantswarm.io/type" "skill-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform") (.Values.muster.mcpServer.labels | default dict) }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with .Values.muster.mcpServer.displayName }}
  annotations:
    ui.giantswarm.io/display-name: {{ . | quote }}
  {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "skill-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with .Values.muster.mcpServer.timeout }}
  timeout: {{ . | int }}
  {{- end }}
  {{- if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- if and $exchange .Values.muster.mcpServer.auth.forwardToken }}
    providerApps:
      - {{ .Values.github.tokenExchange.audience | quote }}
    {{- end }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
