{{- if and (include "skill-manager.githubTokenExchange" .) (not .Values.github.tokenExchange.existingSecret) }}
{{- /*
The token exchange client when no existing Secret is named:
github.tokenExchange.clientSecret, and clientID beside it when set.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-manager.githubTokenExchangeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.github.tokenExchange.clientSecret | quote }}
  {{- with .Values.github.tokenExchange.clientID }}
  client-id: {{ . | quote }}
  {{- end }}
{{- end }}
