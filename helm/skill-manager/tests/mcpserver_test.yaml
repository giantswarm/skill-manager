# The muster registration: off by default, one streamable-http MCPServer at
# the Service in the agent-platform tool group, forwarding the Dex token and,
# with the GitHub token exchange, naming its App under providerApps.
#
# Run with: make helm-test (helm unittest helm/skill-manager)
suite: mcpserver registration
templates:
  - templates/mcpserver.yaml
release:
  name: skill-manager
  namespace: agent-platform
set:
  muster:
    mcpServer:
      enabled: true
      auth:
        requiredAudiences:
          - dex-k8s-authenticator
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: registers nothing by default
    set:
      muster:
        mcpServer:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: registers one streamable-http MCPServer at the Service in the agent-platform tool group
    asserts:
      - isKind:
          of: MCPServer
      - equal:
          path: metadata.name
          value: skill-manager
      - equal:
          path: metadata.labels["agent-platform.giantswarm.io/tool-group"]
          value: agent-platform
      - equal:
          path: spec.url
          value: http://skill-manager.agent-platform.svc.cluster.local:8080/mcp
      - equal:
          path: spec.auth
          value:
            type: oauth
            forwardToken: true
            requiredAudiences:
              - dex-k8s-authenticator

  - it: names the token exchange audience as the provider App
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          existingSecret: skill-manager-github-exchange
    asserts:
      - equal:
          path: spec.auth
          value:
            type: oauth
            forwardToken: true
            providerApps:
              - skill-manager-app
            requiredAudiences:
              - dex-k8s-authenticator

  - it: names no provider App without the token exchange
    set:
      github:
        enabled: true
    asserts:
      - notExists:
          path: spec.auth.providerApps

  - it: refuses the token exchange while github.enabled is false
    set:
      github:
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: skill-manager-app
          existingSecret: skill-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange.tokenEndpoint is set while github.enabled is false: set github.enabled to check private repositories as the person"

  - it: accepts and ignores the deprecated GitHub pin values
    set:
      muster:
        mcpServer:
          auth:
            github:
              enabled: true
              authorizationServer:
                issuer: https://github.com/apps/giantswarm-agent-manager
    asserts:
      - equal:
          path: spec.auth
          value:
            type: oauth
            forwardToken: true
            requiredAudiences:
              - dex-k8s-authenticator

  - it: refuses an audience muster cannot name a provider App by
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: Skill_Manager
          existingSecret: skill-manager-github-exchange
    asserts:
      - failedTemplate: {}
